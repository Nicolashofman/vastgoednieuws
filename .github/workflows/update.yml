name: Vastgoednieuws bijwerken

on:
  schedule:
    - cron: '0 */2 * * *'   # elke 2 uur
  workflow_dispatch:         # ook handmatig te starten

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Brussels
    steps:
      - uses: actions/checkout@v4
      - name: Nieuws ophalen en pagina bouwen
        run: pwsh -NoProfile -File ./vastgoednieuws.ps1 -GeenBrowser
      - name: Wijzigingen opslaan
        run: |
          git config user.name "vastgoednieuws-bot"
          git config user.email "vastgoednieuws-bot@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || (git commit -m "Nieuws bijgewerkt" && git push)
